services:
  synology-mcp:
    build: .
    image: mcp-server-synology:latest
    container_name: synology-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SYNOLOGY_MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      # Bound to loopback by default so only the local reverse proxy can reach
      # it. Override SYNOLOGY_HOST_BIND to expose it directly.
      - "${SYNOLOGY_HOST_BIND:-127.0.0.1}:${SYNOLOGY_HOST_PORT:-3020}:3000"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http'+'://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
